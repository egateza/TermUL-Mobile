name: termul_mobile
description: "TermUL Mobile: klien SSH pribadi untuk Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

# Versi dikunci persis (tanpa ^). Lisensi diperiksa 2026-10-15; lihat docs/licenses.md.
# xterm 4.0.0 (MIT), bukan xterm3 (AGPL). Tambah paket baru hanya setelah lisensinya dicek.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dartssh2: 4.1.0
  xterm: 4.0.0
  flutter_secure_storage: 11.2.0
  local_auth: 3.0.2
  crypto: 3.0.7
  path_provider: 2.1.6
  uuid: 4.6.0
  flutter_riverpod: 3.4.3
  file_selector: 1.1.0
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true
