<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Widget streak</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid #F0B34A;outline-offset:2px}
</style>
</helmet>
<a href="{{href}}" aria-label="{{aria}}" style="display: block; box-sizing: border-box; width: {{w}}px; height: {{h}}px; padding: 14px; border-radius: 24px; border: 1px solid {{cardBd}}; background: {{cardBg}}; color: #E8EEF0; font-family: 'IBM Plex Sans', system-ui, sans-serif; overflow: hidden">
<div style="display: flex; gap: 16px; height: 100%">

<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; align-items: flex-start; justify-content: space-between">
<span style="position: relative; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px">
<dc-import name="FlameArt" count="{{flameCount}}" mode="{{flameMode}}" size="30" cracks="0" need="5" hint-size="39px,38px"></dc-import>
</span>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #9AA8AF">{{lvlText}}</span>
</div>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 34px; font-weight: 500; line-height: 1; color: {{countColor}}">{{count}}</span>
<span style="font-size: 12px; line-height: 1.35; color: #C5D0D5">{{shortText}}</span>
</div>

<sc-if value="{{isMedium}}" hint-placeholder-val="{{ false }}">
<div style="flex: none; width: 150px; display: flex; flex-direction: column; justify-content: space-between">
<span style="font-size: 11px; color: #9AA8AF">Pekan ini</span>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{week}}" as="d" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<span style="font-size: 10.5px; color: #9AA8AF">{{d.l}}</span>
<span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; border: 2px {{d.bs}} {{d.bd}}; background: {{d.bg}}"></span>
</div>
</sc-for>
</div>
<span style="font-size: 11.5px; line-height: 1.35; color: #C5D0D5">{{longText}}</span>
</div>
</sc-if>

</div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"enum","default":"small","options":["small","medium"],"section":"Widget"},"state":{"editor":"enum","default":"aktif","options":["aktif","bara","padam","beku","hangus"],"section":"Widget"},"level":{"editor":"range","default":3,"min":1,"max":9,"step":1,"section":"Widget"},"$preview":{"width":148,"height":148}}'>
class Component extends DCLogic {
  renderVals() {
    const P = this.props;
    const size = P.size === 'medium' ? 'medium' : 'small';
    const modes = ['aktif', 'bara', 'padam', 'beku', 'hangus'];
    const st = modes.indexOf(P.state) >= 0 ? P.state : 'aktif';
    let level = parseInt(P.level, 10);
    if (!(level >= 1 && level <= 9)) level = 3;
    const w = parseInt(P.w, 10) || (size === 'medium' ? 312 : 148);
    const h = parseInt(P.h, 10) || 148;

    // Tier dan palet dari artifact desktop "Streak Api TermUL" (warna tengah tiap api).
    const COLORS = ['#d0601f', '#ff9d1f', '#ff4d2e', '#ff3f9f', '#9a5cff', '#3c8cff', '#1edb98', '#ffc21a', '#ffb000'];
    const NAMES = ['Bara', 'Api Jingga', 'Api Merah', 'Api Magenta', 'Api Ungu', 'Api Biru', 'Api Zamrud', 'Api Emas', 'Api Pelangi'];
    const TC = [2, 5, 15, 40, 70, 120, 200, 400, 800];
    const fmt = (n) => (n < 3 ? (n + '/3') : (n + 'x'));

    const CFG = {
      aktif: { n: TC[level - 1], count: fmt(TC[level - 1]), href: 'Streak.dc.html', short: 'Api menyala', long: 'Hari ini terhitung sejak aplikasi dibuka.' },
      bara: { n: 2, count: fmt(2), href: 'Streak.dc.html', short: 'Bara', long: 'Buka TermUL lagi besok. Streak menyala di hari ke-3.' },
      padam: { n: 47, count: fmt(47), href: 'StreakPadam.dc.html', short: 'Api padam', long: 'Kemarin kamu tidak membuka TermUL. Buka aplikasi untuk menyalakan.' },
      beku: { n: 47, count: fmt(47), href: 'StreakBeku.dc.html', short: 'Api beku', long: 'Absen 5 hari, api membeku. Buka aplikasi untuk memecahkan es.' },
      hangus: { n: 47, count: fmt(47), href: 'StreakHangus.dc.html', short: 'Hangus', long: 'Absen lebih dari 10 hari. Buka aplikasi untuk mulai lagi.' }
    };
    const c = CFG[st];

    const WEEK = {
      aktif: ['on', 'on', 'on', 'today', 'fut', 'fut', 'fut'],
      bara: ['miss', 'miss', 'on', 'today', 'fut', 'fut', 'fut'],
      padam: ['on', 'miss', 'miss', 'pend', 'fut', 'fut', 'fut'],
      beku: ['miss', 'miss', 'miss', 'pend', 'fut', 'fut', 'fut'],
      hangus: ['miss', 'miss', 'miss', 'pend', 'fut', 'fut', 'fut']
    };
    const letters = ['S', 'S', 'R', 'K', 'J', 'S', 'M'];
    const tint = st === 'bara' ? COLORS[0] : COLORS[level - 1];
    const look = {
      on: { bg: tint, bd: tint, bs: 'solid' },
      today: { bg: tint, bd: '#E8EEF0', bs: 'solid' },
      miss: { bg: 'transparent', bd: '#3A464D', bs: 'solid' },
      pend: { bg: 'transparent', bd: '#F0B34A', bs: 'dashed' },
      fut: { bg: 'transparent', bd: '#242E34', bs: 'solid' }
    };
    const week = WEEK[st].map((k, i) => ({ l: letters[i], bg: look[k].bg, bd: look[k].bd, bs: look[k].bs }));

    let lvlText = 'Lv ' + level + ' \u00b7 ' + NAMES[level - 1];
    if (st === 'bara') lvlText = 'Lv 1 \u00b7 Bara';
    if (st === 'hangus') lvlText = 'Tanpa level';
    if (st === 'padam' || st === 'beku') lvlText = 'Lv ' + level;
    if (size === 'small' && (st === 'aktif')) lvlText = 'Lv ' + level;

    const countColor = st === 'aktif' ? COLORS[level - 1] : (st === 'bara' ? COLORS[0] : (st === 'beku' ? '#9BD4F5' : (st === 'padam' ? '#9AA8AF' : '#7F8D94')));

    return {
      href: c.href,
      aria: 'Streak ' + c.count + ', ' + c.short + '. Ketuk untuk membuka aplikasi.',
      w: w,
      h: h,
      cardBg: st === 'beku' ? '#10202B' : '#161C20',
      cardBd: st === 'beku' ? '#2B4F66' : '#2A343A',
      flameCount: c.n,
      flameMode: st === 'padam' ? 'gray' : (st === 'beku' ? 'frozen' : (st === 'hangus' ? 'reset' : 'active')),
      isLit: st === 'aktif',
      isEmber: st === 'bara',
      isOut: st === 'padam',
      isIce: st === 'beku',
      isBurnt: st === 'hangus',
      flameColor: st === 'bara' ? COLORS[0] : COLORS[level - 1],
      showSpark: st === 'aktif' && level >= 5 && level < 9,
      showStar: st === 'aktif' && level === 9,
      lvlText: lvlText,
      count: c.count,
      countColor: countColor,
      shortText: c.short,
      longText: c.long,
      isMedium: size === 'medium',
      week: week
    };
  }
}
</script>
</body>
</html>
