<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Sesi aktif</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid #F0B34A;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0F1316; color: #E8EEF0; font-family: 'IBM Plex Sans', system-ui, sans-serif; overflow: hidden">

<div style="display: flex; align-items: center; gap: 4px; padding: 20px 20px 8px 8px">
<a href="Main.dc.html" aria-label="Kembali" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #E8EEF0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
</a>
<h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em">Sesi aktif</h1>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 20px 24px 20px; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0 12px 6px 12px; font-size: 12.5px; line-height: 1.4; color: #9AA8AF">Ketuk sesi untuk melanjutkannya.</p>

<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 4px; padding: 10px 6px 10px 16px; border-radius: 14px; border: 1px solid #2A343A; background: #161C20">
<a href="Terminal.dc.html" aria-label="{{r.aria}}" style="flex: 1; min-width: 0; min-height: 56px; display: flex; flex-direction: column; justify-content: center; gap: 4px">
<span style="font-size: 16px; font-weight: 500; color: #E8EEF0">{{r.title}}</span>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; color: #9AA8AF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.target}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: {{r.color}}">
<span style="width: 8px; height: 8px; border-radius: 50%; background: {{r.color}}"></span>
{{r.status}}
</span>
</a>
<button type="button" aria-label="{{r.closeAria}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 12px; background: transparent; color: #9AA8AF; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
</div>
</sc-for>

<button type="button" style="margin-top: 10px; min-height: 48px; border-radius: 12px; border: 1px solid #5C6A71; background: transparent; color: #E8EEF0; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; cursor: pointer">Putuskan semua</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const OK = '#5ED3A6', BAD = '#FF7F70', BUSY = '#F0B34A';
    const rows = [
      { title: 'app-01', target: 'deploy@10.0.1.11:22 · mulai 14.02', status: 'Tersambung', color: OK },
      { title: 'app-01 · sesi 2', target: 'deploy@10.0.1.11:22 · mulai 14.20', status: 'Tersambung', color: OK },
      { title: 'db-01', target: 'postgres@10.0.1.21:22 · mulai 13.47', status: 'Terputus', color: BAD }
    ].map((r) => Object.assign({}, r, {
      aria: r.title + ', ' + r.status.toLowerCase() + '. Ketuk untuk melanjutkan.',
      closeAria: 'Putuskan ' + r.title
    }));
    return { rows: rows };
  }
}
</script>
</body>
</html>
