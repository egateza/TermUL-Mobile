<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Daftar host</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #F0B34A;outline-offset:2px}
input::placeholder{color:#7F8D94}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0F1316; color: #E8EEF0; font-family: 'IBM Plex Sans', system-ui, sans-serif; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 4px 20px">
<div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 15px; font-weight: 500; letter-spacing: 0.04em; color: #E8EEF0">termul<span style="color: #F0B34A">_</span></div>
<div style="display: flex; align-items: center; gap: 8px">
<a href="{{chipHref}}" aria-label="{{chipAria}}" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid {{chipBd}}; background: {{chipBg}}; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; font-weight: 500; color: {{chipFg}}">
<dc-import name="FlameArt" count="{{chipCount}}" mode="{{chipMode}}" size="18" cracks="0" need="5" hint-size="24px,23px"></dc-import>
{{chipLabel}}
</a>
<a href="{{vaultHref}}" aria-label="{{vaultAria}}" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid {{vaultBd}}; background: #161C20; font-size: 13px; color: {{vaultFg}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="{{vaultShackle}}"/></svg>
{{vaultLabel}}
</a>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 20px 12px 20px">
<h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em">Host</h1>
<div style="display: flex; align-items: center; gap: 8px">
<a href="HostImport.dc.html" aria-label="Impor profil" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 12px; border: 1px solid #2A343A; background: #161C20; color: #C5D0D5; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v11M7 11l5 5 5-5M5 19h14"/></svg>
</a>
<button type="button" aria-label="Tambah host" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #F0B34A; color: #1B1406; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>
</div>
</div>

<div style="padding: 0 20px 12px 20px">
<label for="cari" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Cari host</label>
<div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #2A343A; background: #161C20; color: #9AA8AF">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
<input id="cari" type="text" value="{{query}}" onChange="{{setQuery}}" placeholder="Cari nama, user, atau IP" style="flex: 1; min-width: 0; height: 100%; border: none; background: transparent; color: #E8EEF0; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px">
</div>
</div>

<div style="display: flex; gap: 8px; padding: 0 20px 8px 20px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; font-weight: 500; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 8px 12px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="margin-bottom: 4px">
<button type="button" onClick="{{g.toggle}}" aria-expanded="{{g.open}}" style="width: 100%; min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border: none; background: transparent; color: #9AA8AF; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; text-align: left">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{g.rot}}deg)"><path d="M6 9l6 6 6-6"/></svg>
<span style="flex: 1">{{g.name}}</span>
<span>{{g.count}}</span>
</button>
<sc-if value="{{g.open}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{g.hosts}}" as="h" hint-placeholder-count="2">
<a href="Terminal.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 64px; box-sizing: border-box; padding: 10px 14px; border-radius: 14px; border: 1px solid #2A343A; background: #161C20">
<span style="width: 10px; height: 10px; border-radius: 50%; flex: none; background: {{h.dot}}"></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="display: flex; align-items: center; gap: 6px; min-width: 0"><span style="font-size: 16px; font-weight: 500; color: #E8EEF0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{h.name}}</span><sc-if value="{{h.fav}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="#F0B34A" stroke="#F0B34A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Favorit" style="flex: none"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></sc-if></span>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; color: #9AA8AF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{h.target}}</span>
</span>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: {{h.statusColor}}; flex: none">{{h.status}}</span>
</a>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 40px 16px; text-align: center; color: #9AA8AF; font-size: 14px; line-height: 1.5">Tidak ada host yang cocok.<br>Ubah kata kunci atau filter.</div>
</sc-if>
</div>

<nav aria-label="Navigasi utama" style="display: flex; border-top: 1px solid #2A343A; background: #0F1316; padding: 6px 12px 10px 12px">
<a href="Main.dc.html" aria-current="page" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #F0B34A; font-size: 12px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
Host
</a>
<a href="Terminal.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9AA8AF; font-size: 12px; font-weight: 500">
<span style="position: relative; display: flex">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>
<span style="position: absolute; top: -6px; right: -12px; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 9px; background: #F0B34A; color: #1B1406; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center">2</span>
</span>
Sesi
</a>
<a href="Snippets.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9AA8AF; font-size: 12px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4c-2 0-3 1-3 3v2c0 1-1 3-2 3 1 0 2 2 2 3v2c0 2 1 3 3 3M16 4c2 0 3 1 3 3v2c0 1 1 3 2 3-1 0-2 2-2 3v2c0 2-1 3-3 3"/></svg>
Snippet
</a>
<a href="Settings.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9AA8AF; font-size: 12px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
Pengaturan
</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"streakState":{"editor":"enum","default":"aktif","options":["aktif","bara","padam","beku"],"section":"Streak"},"vault":{"editor":"enum","default":"terkunci","options":["terkunci","terbuka","permanen"],"section":"Vault"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const query = s.query || '';
    const filter = s.filter || 'all';
    const closed = s.closed || {};
    const q = query.trim().toLowerCase();

    const data = [
      { name: 'Produksi', hosts: [
        { name: 'app-01', user: 'deploy', addr: '10.0.1.11', online: true, fav: true, ms: 18 },
        { name: 'db-01', user: 'postgres', addr: '10.0.1.21', online: true, fav: true, ms: 21 },
        { name: 'proxy-01', user: 'ubuntu', addr: '10.0.1.5', online: true, fav: false, ms: 14 }
      ]},
      { name: 'Staging', hosts: [
        { name: 'stg-app-01', user: 'deploy', addr: '10.0.2.11', online: true, fav: false, ms: 33 },
        { name: 'stg-db-01', user: 'postgres', addr: '10.0.2.21', online: false, fav: false, ms: 0 }
      ]},
      { name: 'Lab', hosts: [
        { name: 'lab-hv-01', user: 'root', addr: '10.0.9.2', online: true, fav: false, ms: 9 },
        { name: 'nas-01', user: 'admin', addr: '10.0.9.8:2222', online: false, fav: false, ms: 0 }
      ]}
    ];

    const match = (h) => {
      const text = (h.name + ' ' + h.user + '@' + h.addr).toLowerCase();
      if (q && text.indexOf(q) === -1) return false;
      if (filter === 'fav') return h.fav;
      if (filter === 'online') return h.online;
      return true;
    };

    let total = 0;
    const groups = data.map((g) => {
      const hosts = g.hosts.filter(match).map((h) => ({
        name: h.name,
        fav: h.fav,
        target: h.user + '@' + h.addr,
        dot: h.online ? '#5ED3A6' : '#FF7F70',
        status: h.online ? ('online · ' + h.ms + ' ms') : 'tidak terjangkau',
        statusColor: h.online ? '#5ED3A6' : '#FF7F70'
      }));
      total += hosts.length;
      const open = q ? true : !closed[g.name];
      return {
        name: g.name,
        count: hosts.length,
        open: open,
        rot: open ? 0 : -90,
        hosts: hosts,
        toggle: () => this.setState({ closed: Object.assign({}, closed, { [g.name]: !closed[g.name] }) })
      };
    }).filter((g) => g.count > 0);

    const chipDefs = [
      { id: 'all', label: 'Semua' },
      { id: 'fav', label: 'Favorit' },
      { id: 'online', label: 'Online' }
    ];
    const chips = chipDefs.map((c) => {
      const on = filter === c.id;
      return {
        label: c.label,
        on: on,
        bg: on ? '#F0B34A' : '#161C20',
        fg: on ? '#1B1406' : '#C5D0D5',
        bd: on ? '#F0B34A' : '#2A343A',
        pick: () => this.setState({ filter: c.id })
      };
    });

    const CHIPS = {
      aktif: { n: '11x', count: 11, mode: 'active', fg: '#ff4d2e', bd: '#2A343A', bg: '#161C20', fill: 'none', size: 16, ice: false, aria: 'Streak 11 hari, Api Merah' },
      bara: { n: '2/3', count: 2, mode: 'active', fg: '#e58a50', bd: '#2A343A', bg: '#161C20', fill: 'none', size: 12, ice: false, aria: 'Hari ke-2 dari 3 menuju streak' },
      padam: { n: '23x', count: 23, mode: 'gray', fg: '#8d9299', bd: '#2A343A', bg: '#161C20', fill: 'none', size: 16, ice: false, aria: 'Streak 23 hari padam. Ketuk untuk membuka dan menyalakan.' },
      beku: { n: '23x', count: 23, mode: 'frozen', fg: '#9fd6ff', bd: '#2B4F66', bg: '#10202B', fill: 'none', size: 16, ice: true, aria: 'Streak 23 hari beku. Ketuk untuk membuka dan memecahkan es.' }
    };
    const chip = CHIPS[this.props.streakState] || CHIPS.aktif;
    const HREFS = { aktif: 'Streak.dc.html', bara: 'Streak.dc.html', padam: 'StreakScreenPadam.dc.html', beku: 'StreakScreenBeku.dc.html' };
    const chipHref = HREFS[this.props.streakState] || 'Streak.dc.html';

    // Vault: terkunci (ketuk membuka dengan biometrik), terbuka sampai layar mati (ketuk mengunci), permanen (Pengaturan).
    const VAULTS = {
      terkunci: { label: 'Vault terkunci', shackle: 'M8 11V8a4 4 0 0 1 8 0v3', fg: '#9AA8AF', bd: '#2A343A', href: 'SudoSheet.dc.html', aria: 'Vault terkunci. Ketuk untuk membuka dengan biometrik.' },
      terbuka: { label: 'Vault terbuka', shackle: 'M8 11V8a4 4 0 0 1 7.5-2', fg: '#F0B34A', bd: '#F0B34A', href: 'Main.dc.html', aria: 'Vault terbuka. Ketuk untuk mengunci.' },
      permanen: { label: 'Vault terbuka', shackle: 'M8 11V8a4 4 0 0 1 7.5-2', fg: '#F0B34A', bd: '#F0B34A', href: 'Settings.dc.html', aria: 'Vault terbuka permanen. Ketuk untuk keterangan.' }
    };
    const vault = VAULTS[this.props.vault] || VAULTS.terkunci;

    return {
      vaultLabel: vault.label,
      vaultShackle: vault.shackle,
      vaultFg: vault.fg,
      vaultBd: vault.bd,
      vaultHref: vault.href,
      vaultAria: vault.aria,
      chipLabel: chip.n,
      chipCount: chip.count,
      chipMode: chip.mode,
      chipFg: chip.fg,
      chipBd: chip.bd,
      chipBg: chip.bg,
      chipFill: chip.fill,
      chipSize: chip.size,
      chipFlame: !chip.ice,
      chipIce: chip.ice,
      chipAria: chip.aria,
      chipHref: chipHref,
      query: query,
      setQuery: (e) => this.setState({ query: e.target.value }),
      chips: chips,
      groups: groups,
      empty: total === 0
    };
  }
}
</script>
</body>
</html>
